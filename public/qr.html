<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>톡톡그램 QR</title>
<link rel="icon" href="/favicon.svg">
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
         font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; background: #fff8f0; color: #1f2d3d; }
  h1 { margin: 0; font-size: 56px; font-weight: 800; background: linear-gradient(90deg, #f58529, #dd2a7b 50%, #8134af);
       -webkit-background-clip: text; background-clip: text; color: transparent; }
  img { width: min(60vh, 80vw); height: min(60vh, 80vw); background: #fff; padding: 18px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
  p { margin: 0; font-size: 26px; font-weight: 700; }
  code { font-size: 20px; color: #4a5568; }
</style>
</head>
<body>
  <h1>톡톡그램</h1>
  <img id="qr" alt="톡톡그램 접속 QR 코드">
  <p>휴대폰 카메라로 QR을 찍어 접속하세요</p>
  <code id="url"></code>
<script>
  const url = location.origin + "/";
  document.getElementById("url").textContent = url;
  // 무료 QR 생성 서비스(goqr.me) 이미지 사용
  document.getElementById("qr").src = "https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=0&data=" + encodeURIComponent(url);
</script>
</body>
</html>
